<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" lang="de">
<title id="t">Schematischer Tagesverlauf von Solarerzeugung und Haushaltsverbrauch</title>
<desc id="d">Schematische Darstellung ohne Messwerte: Die Erzeugung der Module steigt am Morgen, erreicht mittags ihr Maximum und fällt bis zum Abend. Der Verbrauch hat eine Spitze am Morgen und eine größere am Abend. Mittags ist die Erzeugung höher als der Verbrauch – dieser Überschuss lädt den Speicher. Am Abend ist der Verbrauch höher als die Erzeugung – dann gibt der Speicher Energie ab.</desc>
