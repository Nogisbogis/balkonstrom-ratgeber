<text x="20" y="52" class="m" font-size="12.5" text-anchor="start" font-weight="normal" >Schematische Darstellung – keine Messwerte, ohne Zahlenskala. Der Verlauf ändert sich mit Wetter, Jahreszeit und Haushalt.</text>
