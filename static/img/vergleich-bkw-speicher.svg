<desc id="d">Balkendiagramm: Anker SOLIX Solarbank 2 E1600 Pro: 1,6 kWh, PV-Eingang 2.400 W; EcoFlow STREAM Pro: 1,92 kWh, PV-Eingang 1.500 W; Zendure SolarFlow 800 Plus: 1,92 kWh, PV-Eingang 1.500 W; EcoFlow STREAM Ultra: 1,92 kWh, PV-Eingang 2.000 W; Zendure SolarFlow 800 Pro: 1,92 kWh, PV-Eingang 2.640 W; Zendure SolarFlow 800 Pro 2: 1,92 kWh, PV-Eingang 2.640 W; Growatt NEXA 2000: 2,048 kWh, PV-Eingang 2.600 W; Zendure SolarFlow 2400 AC+: 2,4 kWh, kein PV-Eingang (AC-gekoppelt); Jackery SolarVault 3 Pro Max: 2,52 kWh, PV-Eingang 4.000 W; Anker SOLIX Solarbank 3 E2700 Pro: 2,688 kWh, PV-Eingang 3.600 W; EcoFlow STREAM Ultra X: 3,84 kWh, PV-Eingang 2.000 W; Anker SOLIX Solarbank 4 E5000 Pro: 5,024 kWh, PV-Eingang 5.000 W; Anker SOLIX Solarbank Max: 7 kWh, PV-Eingang 10.000 W. Eine gestrichelte Linie markiert die 2.000-Wp-Grenze für Steckersolargeräte.</desc>
