<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" width="760" height="426" role="img" aria-labelledby="t d" lang="de">
<title id="t">Ladezeit einer Powerstation im Auto je nach Ladeweg</title>
<desc id="d">Balkendiagramm. Anker C2000 Gen 2 (2.048 Wh), an der 12-V-Buchse, 100 W: Herstellerangabe 23 h. EcoFlow DELTA 3 Plus (1.024 Wh), an der 12-V-Buchse, max. 12 V × 8 A ≈ 96 W: eigene Rechnung, mindestens 10 h 40 min. DJI Power 1000 Mini (1.008 Wh), an der 12-V-Buchse, bis 120 W: eigene Rechnung, mindestens 8 h 24 min. DJI Power 1000 Mini (1.008 Wh), Kabel an der Starterbatterie, bis 400 W: eigene Rechnung, mindestens 2 h 31 min. Anker C2000 Gen 2 (2.048 Wh), Lichtmaschinenlader, 800 W: Herstellerangabe 2 h 36 min. EcoFlow DELTA 3 Plus (1.024 Wh), Batterieladegerät 800 W: Herstellerangabe 1 h 18 min.</desc>
<style>
