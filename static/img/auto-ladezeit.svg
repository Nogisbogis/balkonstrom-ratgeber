<text x="20" y="290" class="t" font-size="12.5" text-anchor="start" font-weight="bold" >Anker C2000 Gen 2 (2.048 Wh)</text>
<text x="20" y="307" class="m" font-size="11.5" text-anchor="start" font-weight="normal" >Lichtmaschinenlader, 800 W</text>
