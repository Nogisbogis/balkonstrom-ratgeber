<text x="20" y="404" class="m" font-size="11.5" text-anchor="start" font-weight="normal" >Herstellerangaben: Anker (interne Labortests), EcoFlow. DJI nennt nur die Leistung, die Zeiten sind gerechnet. Keine eigene Messung.</text>
