<text x="378.1" y="297" class="t" font-size="12" text-anchor="start" font-weight="bold" >2 h 36 min</text>
<text x="20" y="336" class="t" font-size="12.5" text-anchor="start" font-weight="bold" >EcoFlow DELTA 3 Plus (1.024 Wh)</text>
