<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" lang="de">
<title id="t">Dauerleistung der Powerstations im Vergleich</title>
<desc id="d">Balkendiagramm der Dauerleistung: EcoFlow RIVER 3 300 W; Jackery Explorer 300 Plus 300 W; Anker SOLIX C300X 300 W; EcoFlow RIVER 3 Plus 600 W; DJI Power 1000 Mini 800 W; Jackery Explorer 1000 v2 1.500 W; EcoFlow DELTA 3 Plus 1.800 W; BLUETTI Elite 100 V2 1.800 W; Anker SOLIX C1000 Gen 2 2.000 W; Anker SOLIX C2000 Gen 2 2.400 W. Eine gestrichelte Linie markiert 1.000 Watt.</desc>
