<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" lang="de">
<title id="t">Monatsertrag eines 800-Wp-Balkonkraftwerks in Hamburg nach Ausrichtung</title>
<desc id="d">Säulendiagramm mit Monatswerten nach PVGIS für Hamburg, 0,8 kWp. 30° Süd: Jan 20,3 kWh, Feb 35,9 kWh, Mär 65,7 kWh, Apr 95,3 kWh, Mai 103,1 kWh, Jun 103,3 kWh, Jul 102,0 kWh, Aug 90,2 kWh, Sep 75,2 kWh, Okt 50,6 kWh, Nov 24,6 kWh, Dez 17,2 kWh. senkrecht Süd: Jan 24,3 kWh, Feb 37,8 kWh, Mär 56,5 kWh, Apr 66,3 kWh, Mai 58,9 kWh, Jun 53,3 kWh, Jul 55,6 kWh, Aug 57,3 kWh, Sep 59,8 kWh, Okt 50,1 kWh, Nov 28,4 kWh, Dez 22,1 kWh. senkrecht West: Jan 6,9 kWh, Feb 14,9 kWh, Mär 32,1 kWh, Apr 48,1 kWh, Mai 55,0 kWh, Jun 57,7 kWh, Jul 56,1 kWh, Aug 48,0 kWh, Sep 37,0 kWh, Okt 22,0 kWh, Nov 9,1 kWh, Dez 5,6 kWh. Im Sommer liefert die 30-Grad-Anlage am meisten, von November bis Februar die senkrechte Südanlage.</desc>
