<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="t d" lang="de">
<title id="t">Ablaufdiagramm: Balkonkraftwerk anmelden und in Betrieb nehmen</title>
<desc id="d">Fünf Schritte: 1. Gerät prüfen – Wechselrichter höchstens 800 VA laut Typenschild, Module höchstens 2.000 Watt, für Schuko höchstens 960 Watt und DIN VDE V 0126-95. 2. Zustimmung von Vermieter oder Eigentümergemeinschaft einholen. 3. Sicher montieren und passend anschließen. 4. Innerhalb eines Monats im Marktstammdatenregister registrieren; mit Speicher diesen angeben und zusätzlich beim Netzbetreiber anmelden. 5. Zählertausch durch den Messstellenbetreiber abwarten, im Regelfall kostenlos.</desc>
<style>
.bg{fill:#ffffff}.t{fill:#1d2a33}.m{fill:#5b6b75}.g{stroke:#dde5e0}.ax{stroke:#5b6b75}
.a{fill:#0b7a4b}.as{stroke:#0b7a4b}.b{fill:#9a5b00}.bs{stroke:#9a5b00}.c{fill:#2f5d8a}.cs{stroke:#2f5d8a}
.box{fill:#f3f7f4;stroke:#9fb5a8}.boxa{fill:#e3f2ea;stroke:#0b7a4b}.boxb{fill:#fbefdc;stroke:#9a5b00}
.ar{fill:#5b6b75}.ars{stroke:#5b6b75}.al{fill:#0b7a4b;fill-opacity:.18}.bl{fill:#9a5b00;fill-opacity:.18}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){
.bg{fill:#121816}.t{fill:#e3ebe6}.m{fill:#9fb0a8}.g{stroke:#2a3631}.ax{stroke:#9fb0a8}
.a{fill:#4fd197}.as{stroke:#4fd197}.b{fill:#e8b04f}.bs{stroke:#e8b04f}.c{fill:#7fb2e5}.cs{stroke:#7fb2e5}
.box{fill:#18211d;stroke:#3b4a43}.boxa{fill:#14302a;stroke:#4fd197}.boxb{fill:#33280f;stroke:#e8b04f}
.ar{fill:#9fb0a8}.ars{stroke:#9fb0a8}.al{fill:#4fd197;fill-opacity:.2}.bl{fill:#e8b04f;fill-opacity:.2}}
</style>
<rect class="bg" width="760" height="600" rx="8"/>
<defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ar"/></marker></defs>
<text x="20" y="30" class="t" font-size="18" text-anchor="start" font-weight="bold" >Balkonkraftwerk in Betrieb nehmen: Schritt für Schritt</text>
<text x="20" y="52" class="m" font-size="12.5" text-anchor="start" font-weight="normal" >Ablauf laut Bundeswirtschaftsministerium, Bundesnetzagentur, Umweltbundesamt und VDE (Stand Okt. 2026)</text>
<rect x="20" y="70" width="440" height="74" class="box" rx="8" stroke-width="1.5"/>
<circle cx="48" cy="107.0" r="15" class="a"/>
<text x="48" y="112.0" class="bg" font-size="15" text-anchor="middle" font-weight="bold" >1</text>
<text x="74" y="94" class="t" font-size="14.5" text-anchor="start" font-weight="bold" >Gerät prüfen</text>
<text x="74" y="114" class="m" font-size="12" text-anchor="start" font-weight="normal" >Wechselrichter ≤ 800 VA laut Typenschild</text>
<text x="74" y="131" class="m" font-size="12" text-anchor="start" font-weight="normal" >Module ≤ 2.000 W (Schuko: ≤ 960 W, DIN VDE V 0126-95)</text>
<line x1="240.0" y1="146" x2="240.0" y2="167" class="ars" stroke-width="2" marker-end="url(#pf)"/>
<rect x="20" y="170" width="440" height="74" class="box" rx="8" stroke-width="1.5"/>
<circle cx="48" cy="207.0" r="15" class="a"/>
<text x="48" y="212.0" class="bg" font-size="15" text-anchor="middle" font-weight="bold" >2</text>
<text x="74" y="194" class="t" font-size="14.5" text-anchor="start" font-weight="bold" >Zustimmung einholen</text>
<text x="74" y="214" class="m" font-size="12" text-anchor="start" font-weight="normal" >Mieter: Vermieter fragen (§ 554 BGB)</text>
<text x="74" y="231" class="m" font-size="12" text-anchor="start" font-weight="normal" >Eigentümer: Gemeinschaft fragen (§ 20 Abs. 2 Nr. 5 WEG)</text>
<line x1="240.0" y1="246" x2="240.0" y2="267" class="ars" stroke-width="2" marker-end="url(#pf)"/>
<rect x="20" y="270" width="440" height="74" class="box" rx="8" stroke-width="1.5"/>
<circle cx="48" cy="307.0" r="15" class="a"/>
<text x="48" y="312.0" class="bg" font-size="15" text-anchor="middle" font-weight="bold" >3</text>
<text x="74" y="294" class="t" font-size="14.5" text-anchor="start" font-weight="bold" >Montieren und anschließen</text>
<text x="74" y="314" class="m" font-size="12" text-anchor="start" font-weight="normal" >Sicher montieren (Wind, Schnee), passende Steckdose,</text>
<text x="74" y="331" class="m" font-size="12" text-anchor="start" font-weight="normal" >keine Mehrfachsteckdose; Stromkreis ggf. prüfen lassen</text>
<line x1="240.0" y1="346" x2="240.0" y2="367" class="ars" stroke-width="2" marker-end="url(#pf)"/>
<rect x="20" y="370" width="440" height="74" class="boxa" rx="8" stroke-width="1.5"/>
<circle cx="48" cy="407.0" r="15" class="a"/>
<text x="48" y="412.0" class="bg" font-size="15" text-anchor="middle" font-weight="bold" >4</text>
<text x="74" y="394" class="t" font-size="14.5" text-anchor="start" font-weight="bold" >Im Marktstammdatenregister registrieren</text>
<text x="74" y="414" class="m" font-size="12" text-anchor="start" font-weight="normal" >innerhalb eines Monats nach Inbetriebnahme</text>
<text x="74" y="431" class="m" font-size="12" text-anchor="start" font-weight="normal" >Netzbetreiber-Meldung fürs Balkonkraftwerk entfällt</text>
<line x1="240.0" y1="446" x2="240.0" y2="467" class="ars" stroke-width="2" marker-end="url(#pf)"/>
<rect x="20" y="470" width="440" height="74" class="box" rx="8" stroke-width="1.5"/>
<circle cx="48" cy="507.0" r="15" class="a"/>
<text x="48" y="512.0" class="bg" font-size="15" text-anchor="middle" font-weight="bold" >5</text>
<text x="74" y="494" class="t" font-size="14.5" text-anchor="start" font-weight="bold" >Zählertausch abwarten</text>
<text x="74" y="514" class="m" font-size="12" text-anchor="start" font-weight="normal" >Messstellenbetreiber prüft und tauscht bei Bedarf –</text>
<text x="74" y="531" class="m" font-size="12" text-anchor="start" font-weight="normal" >im Regelfall kostenlos für dich</text>
<line x1="462" y1="407.0" x2="556" y2="407.0" class="ars" stroke-width="2" marker-end="url(#pf)"/>
<text x="508.0" y="399.0" class="m" font-size="11.5" text-anchor="middle" font-weight="normal" >mit Speicher?</text>
<rect x="560" y="362" width="180" height="90" class="boxb" rx="8" stroke-width="1.5"/>
<text x="650.0" y="385.0" class="t" font-size="13.5" text-anchor="middle" font-weight="bold" >Speicher</text>
<text x="650.0" y="403.0" class="m" font-size="12" text-anchor="middle" font-weight="normal" >im Register mit angeben</text>
<text x="650.0" y="421.0" class="m" font-size="12" text-anchor="middle" font-weight="normal" >und beim Netzbetreiber</text>
<text x="650.0" y="439.0" class="m" font-size="12" text-anchor="middle" font-weight="normal" >anmelden (BMWE)</text>
<text x="20" y="588" class="m" font-size="11.5" text-anchor="start" font-weight="normal" >Keine Rechtsberatung. Details und Quellen im Artikel.</text>
</svg>
