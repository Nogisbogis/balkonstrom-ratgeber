<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" lang="de">
<title id="t">Tagesverlauf der Leistung eines 800-Wp-Balkonkraftwerks im Juni nach Ausrichtung</title>
<desc id="d">Liniendiagramm für Hamburg nach PVGIS, mittlere Leistung je Stunde im Juni. Süd 30 Grad erreicht gegen 13 Uhr rund 430 Watt. Ost 30 Grad hat sein Maximum gegen 11 Uhr mit rund 410 Watt und fällt am Nachmittag ab. West 30 Grad steigt erst am Vormittag an und erreicht gegen 15 Uhr rund 395 Watt, um 19 Uhr noch rund 220 Watt. Senkrecht nach Süden bleibt die Leistung im Sommer unter 280 Watt. Ab 16 Uhr liefert West 41 Prozent, Süd 24 und Ost 13 Prozent des Tagesertrags.</desc>
