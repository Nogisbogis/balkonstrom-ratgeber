# Based on the official GitHub Pages Hugo starter workflow
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Strompreis-Feed: alle 30 Minuten neu bauen, damit /api/strompreis.json aktuell bleibt (keine Commits nötig)
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
      HUGO_ENVIRONMENT: production
      TZ: Europe/Berlin
      # Amazon-Partner-Tag: Repo-Variable oder -Secret AMAZON_PARTNER_TAG (optional)
      HUGO_PARAMS_PARTNERTAG: ${{ vars.AMAZON_PARTNER_TAG || secrets.AMAZON_PARTNER_TAG }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Strompreis-Feed (energy-charts DE-LU → static/api/strompreis.json)
        # Holt den Day-Ahead-Börsenpreis serverseitig; der Browser lädt nur /api/strompreis.json von der eigenen Domain.
        # Bricht den Build nie ab (Fallback: letzter Live-Feed bzw. "available": false).
        run: python3 tools/strompreis_feed.py
      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Setup Node (für Pagefind)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Suchindex mit Pagefind (lokal, ohne Telemetrie)
        run: npx -y pagefind@1.5.2 --site public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
