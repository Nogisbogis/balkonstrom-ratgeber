baseURL = "https://nogisbogis.github.io/balkonstrom-ratgeber/"
locale = "de-DE"
defaultContentLanguage = "de"
title = "Balkonstrom-Ratgeber"
enableRobotsTXT = false
disableKinds = ["taxonomy", "term"]

[params]
  description = "Unabhängige Ratgeber, Vergleiche und Tipps zu Balkonkraftwerken und Powerstations."
  # Amazon-PartnerNet-Tag. Wird beim Build aus der Umgebungsvariable
  # HUGO_PARAMS_PARTNERTAG überschrieben (GitHub: Variable/Secret AMAZON_PARTNER_TAG).
  # Alternativ hier fest eintragen, z. B. partnerTag = "meintag-21".
  partnerTag = ""
  # Solange das Impressum Platzhalter enthält: true lassen (robots noindex auf allen Seiten).
  noindex = true
  disclosure = "Werbung / Affiliate-Links: Als Amazon-Partner verdiene ich an qualifizierten Verkäufen."

[pagination]
  pagerSize = 20
