- slug: anker-solix
  name: Anker SOLIX
  praefix: "Anker SOLIX"
  seite: true
  shop: https://www.ankersolix.com/de
  intro: >-
    Anker SOLIX ist die Energie-Marke von Anker Innovations; Anker stellte sie im Juni 2023 vor.
    Im deutschen SOLIX-Shop gibt es tragbare Powerstations und Balkonkraftwerk-Speicher.
    Anker-Powerbanks laufen unter der Marke Anker und gehören nicht zum SOLIX-Sortiment, deshalb fehlen sie hier.
  quellen:
    - titel: "Anker: Launch der Marke Anker SOLIX (Pressemitteilung, 2023)"
      url: https://www.prnewswire.com/news-releases/anker-expands-into-home-energy-solutions-with-launch-of-anker-solix-brand-301849936.html
    - titel: "Anker SOLIX Deutschland: Sortiment (Navigation Balkonkraftwerk / Powerstations)"
      url: https://www.ankersolix.com/de/s2000
    - titel: "Anker SOLIX Deutschland: About Us (Anker = Ladetechnik inkl. Powerbanks)"
      url: https://www.ankersolix.com/de/about
