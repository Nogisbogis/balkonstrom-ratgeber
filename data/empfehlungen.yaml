- einsatz: Camping klein
  modell: EcoFlow RIVER 3
  grund: Laut EcoFlow mit 3,55 kg die leichteste Station mit 230-V-Steckdose im Vergleich – genug für Handy, Licht und Laptop am Wochenende.
  beleg: /posts/powerstation-camping-kaufberatung/
  ersatz:
    - modell: Jackery Explorer 300 Plus
      grund: Laut Jackery 288 Wh bei 3,75 kg – die 250–300-Wh-Klasse reicht oft für Handy, Licht und Laptop am Wochenende.
    - modell: Anker SOLIX C300X
      grund: Laut Anker 288 Wh bei 4,13 kg – die 250–300-Wh-Klasse reicht oft für Handy, Licht und Laptop am Wochenende.
    - modell: BLUETTI Elite 30 V2
      grund: Laut BLUETTI 288 Wh bei 4,3 kg und 600 W Dauerleistung – die 250–300-Wh-Klasse reicht oft für Handy, Licht und Laptop am Wochenende.
    - modell: EcoFlow RIVER 3 Plus
      grund: Laut EcoFlow 286 Wh bei 4,7 kg und 600 W Dauerleistung – die 250–300-Wh-Klasse reicht oft für Handy, Licht und Laptop am Wochenende.
