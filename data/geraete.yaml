# Typische Leistungswerte für die Geräte-Chips im Laufzeitrechner.
# Nur Werte mit Quelle. w = Watt (typischer Wert, das eigene Gerät kann abweichen),
# h = Startwert für die Stunden (frei gewählte Beispiel-Annahme, im Rechner änderbar).
- key: kuehlbox
