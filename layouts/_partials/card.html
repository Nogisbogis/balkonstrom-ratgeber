<li class="card">
  <div class="card-body">
    {{ with .Params.kategorie }}{{ with site.GetPage (printf "/%s" .) }}<p class="card-kat">{{ .Title }}</p>{{ end }}{{ end }}
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
    <p class="meta">{{ .ReadingTime }} Min. Lesezeit</p>
  </div>
</li>
